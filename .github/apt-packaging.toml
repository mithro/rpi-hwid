# How this repository is packaged, and why it differs from the defaults.
# See https://github.com/mithro/apt-repo-action/blob/main/docs/packaging.md

kind = "B"                  # our own code: debian/ at the root of main
architectures = "all"       # pure Python: python3-rpi-hwid is Architecture: all
suites = ["bookworm", "trixie", "forky", "sid"]

[exceptions]
PKG-SUITES = "NeTV2 (the rpi5-netv2 host)"

# python3-rpi-hwid Depends on python3-spiflash. The build and deb.yml's
# republish step read it from spiflash's own signed repository; deb.yml then
# publishes that .deb in this repository too, so installing python3-rpi-hwid
# needs only this one configured.
[[depends]]
repo = "mithro/spiflash"
reason = "python3-spiflash (the SPI flash part database the labels name flashes from) is not in Debian"
