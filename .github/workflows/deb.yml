name: Debian packages

# Rolling release: every push to main tests, builds python3-rpi-hwid for each
# suite, and republishes a signed flat apt repository per suite on GitHub
# Pages (https://mith.ro/rpi-hwid/<suite>/) through mithro/apt-repo-action.
# The package is Architecture: all (pure Python), so one build per suite
# serves every architecture, arm64 and armhf Raspberry Pis included. A pull
# request runs the same tests and builds, and publishes nothing.
#
# bookworm is built because the NeTV2's host (rpi5-netv2) runs Raspberry Pi
# OS bookworm.
#
# python3-rpi-hwid Depends on python3-spiflash, which is not in Debian.
# spiflash's own repository is bundled (.github/apt-packaging.toml): publish-apt
# copies the python3-spiflash ours needs into each suite here, verified against
# spiflash's signed index and re-signed with this repository's key, so
# installing python3-rpi-hwid needs this repository alone. refresh-bundled.yml
# starts this workflow when spiflash publishes a newer one.
#
# A green run of this workflow on main is also what publishes to PyPI:
# publish-pypi.yml is triggered by it completing (workflow_run), so renaming
# this workflow breaks that trigger.
#
# This follows mithro/apt-repo-action's docs/packaging.md; the differences
# from its defaults are declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same gates as local development (ruff, mypy --strict, pytest with
  # coverage), across the supported Pythons.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so hatch-vcs can derive the version

      # The build generates debian/changelog: apt-repo-action's shared
      # scripts/deb-version.py writes the build's entry, with the version
      # derived from git. Committing a build's output would pin a stale
      # version (and name a commit that may not exist), so it must not be
      # tracked. (This job runs on the runner, which has git, so the checkout
      # is a real clone with an index to ask.)
      - name: debian/changelog is not committed
        run: |
          git rev-parse --is-inside-work-tree
          if git ls-files --error-unmatch debian/changelog; then
            echo "::error file=debian/changelog::debian/changelog is committed, but the build generates it: git rm it"
            exit 1
          fi

      - name: Install poppler (pdftoppm, for the label QR check) and a monospace font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core

      - uses: astral-sh/setup-uv@v7

      - name: Install the matrix Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync all extras and the dev group
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests + coverage gate
        run: uv run pytest

      # The three probe files must stay runnable by the oldest python3 a Pi in
      # the field carries (Raspbian stretch: 3.5). Byte-compile them with a
      # real 3.5 from the python:3.5 image (uv has no 3.7 build for this
      # runner, and 3.7 would not have been the right grammar anyway); the
      # test suite separately refuses f-strings, which 3.5 lacks.
      - name: Byte-compile the probes with python 3.5
        run: >-
          docker run --rm -v "$PWD:/src" -w /src python:3.5-slim
          python -W error -m py_compile src/rpi_hwid/probe.py src/rpi_hwid/fpga.py src/rpi_hwid/tinytapeout.py src/rpi_hwid/esp32.py src/rpi_hwid/esp32_radio.py

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, forky, sid]
        arch: [all]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, build deps from debian/control, and
      # the version from the shared deb-version.py (with ~deb<R>, and ~pr<P>
      # on a pull request). Writes the .debs to built-debs/.
      - name: Build
        id: build
        uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}

      # spiflash's repository is bundled (.github/apt-packaging.toml): the
      # python3-spiflash ours needs is served from our own suites. So the
      # install test takes it from the bundle, not from spiflash's
      # repository, which proves a user needs only ours (apt-repo-action
      # docs/packaging.md, "Bundling a dependency repository"). Dependency
      # repositories that aren't bundled (none today) are still added.
      - name: Check out apt-repo-action's scripts
        uses: actions/checkout@v5
        with:
          repository: mithro/apt-repo-action
          ref: main
          path: .apt-repo-action
          sparse-checkout: scripts

      # The newest python3-spiflash spiflash's repository has for the suite
      # (both are rolling releases), verified as publish-apt verifies it
      # before publishing: the suite's InRelease against spiflash's key, its
      # Packages against InRelease, and the .deb against its Packages stanza
      # and its own control file. The version goes in the log.
      - name: The bundled packages, and the other dependency repositories
        id: bundle
        env:
          SUITE: ${{ matrix.suite }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p bundled-debs
          python3 .apt-repo-action/scripts/bundle-depends.py fetch \
            --suite "$SUITE" --debs built-debs --dest bundled-debs --index
          python3 .apt-repo-action/scripts/apt-sources.py write --unbundled \
            --suite "$SUITE" --dest "$RUNNER_TEMP/apt-sources-unbundled" > /dev/null
          echo "apt-sources=$RUNNER_TEMP/apt-sources-unbundled" >> "$GITHUB_OUTPUT"
          ls -l bundled-debs

      # Install what was just built into a clean container of the same suite,
      # with its dependencies from the Debian archive and python3-spiflash
      # from the bundle, offered to apt as a local source -- as a machine with
      # only this repository configured would -- and run it. trusted=yes is
      # for this throwaway container only: bundle-depends.py verified every
      # bundled file above.
      - name: Install test
        env:
          SUITE: ${{ matrix.suite }}
          APT_SOURCES: ${{ steps.bundle.outputs.apt-sources }}
        run: |
          # --platform: an Architecture: all build runs on this runner's own
          # architecture, and an earlier pull may have pointed the tag elsewhere.
          docker run --rm --platform linux/amd64 \
            -v "$APT_SOURCES:/apt-sources:ro" \
            -v "$PWD/built-debs:/debs:ro" \
            -v "$PWD/bundled-debs:/bundled:ro" \
            "docker.io/library/debian:$SUITE" \
            sh -ec 'sh /apt-sources/install.sh
                    echo "deb [trusted=yes] file:/bundled ./" > /etc/apt/sources.list.d/bundled.list
                    apt-get update -q && apt-get install -y -q --no-install-recommends /debs/*.deb
                    apt-cache policy python3-spiflash
                    rpi-hwid revision c04170
                    rpi-hwid name --netv2 0x00742c4e63b9085c
                    python3 -c "import rpi_hwid.probe, rpi_hwid.fpga, rpi_hwid.model"
                    python3 -c "from rpi_hwid import spi_flash_parts as p; n = p.name(0xc84016); print(p.version(), n); assert n.startswith((\"GD25Q32\", \"GD25x32\")), n"'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          retention-days: 14

  publish-apt:
    # Build and install-test pull requests, but never publish from one (or
    # from any branch but main): that would overwrite the live repository
    # with unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid"
      # Pure Python: one Architecture: all deb serves every architecture.
      architectures: "all"
      description: "Raspberry Pi hardware identity: probe, collector and labels"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
