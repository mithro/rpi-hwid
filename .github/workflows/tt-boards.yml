name: Tiny Tapeout board data

# Does the committed src/rpi_hwid/tt_boards.json still match the published
# spreadsheet it was generated from? The sheet is edited by hand and the
# labels are printed from this file, so drift is silent otherwise: a shuttle
# gains a colour, or one is corrected, and the labels keep the old one.
#
# Deliberately NOT a job in ci.yml. That workflow completing green on main is
# what triggers publish-pypi.yml, so a check that reaches out to Google would
# put every release at the mercy of someone editing a spreadsheet, or of
# docs.google.com having a bad afternoon. Here a red run says "the data needs
# regenerating" and nothing else stops.
#
# The schedule is what makes it useful: drift arrives when the sheet is
# edited, not when this repository is pushed to.

on:
  push:
    branches: [main]
    paths:
      - "src/rpi_hwid/tt_boards.json"
      - "tools/fetch_tt_boards.py"
      - ".github/workflows/tt-boards.yml"
  pull_request:
    paths:
      - "src/rpi_hwid/tt_boards.json"
      - "tools/fetch_tt_boards.py"
      - ".github/workflows/tt-boards.yml"
  schedule:
    - cron: "17 6 * * 1"       # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: tt-boards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Does the committed data still match the spreadsheet?
        run: uv run tools/fetch_tt_boards.py --check

      - name: What to do when this fails
        if: failure()
        run: |
          echo "::notice::The spreadsheet and src/rpi_hwid/tt_boards.json disagree."
          echo "::notice::Run 'uv run tools/fetch_tt_boards.py' and commit the result."
          echo "::notice::The diff above is the committed file on the left, the sheet on the right."
