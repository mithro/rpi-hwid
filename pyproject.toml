[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rpi-hwid"
dynamic = ["version"]
description = "Raspberry Pi hardware identity: what a Pi wears, what powers it, which FPGA board it hosts, and print-ready labels for all of it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tim Ansell", email = "me@mith.ro" }]
keywords = ["raspberry-pi", "hat", "poe", "fpga", "labels", "inventory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware",
]
# The probe modules themselves (rpi_hwid.probe, rpi_hwid.fpga) are stdlib-only
# and run on python3 >= 3.5 on the target Pi; this package's own code is 3.11+.
dependencies = []

[project.optional-dependencies]
# rpi-hwid labels: the PDF, its QR codes, and the SVG marks
labels = ["reportlab>=4", "segno>=1.6", "svglib>=1.5", "pillow>=10"]
# rpi-hwid labels --check: decode every QR on the rendered sheets
check = ["zxing-cpp>=2", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/mithro/rpi-hwid"
Issues = "https://github.com/mithro/rpi-hwid/issues"

[project.scripts]
rpi-hwid = "rpi_hwid.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0",
       "reportlab>=4", "segno>=1.6", "svglib>=1.5", "pillow>=10", "zxing-cpp>=2"]

# Rolling release: the version is derived from git (`git describe`), never
# hand-edited. vX.Y tags are the only human input (v0.0 on the root commit per
# the repo-setup guidance); every commit after a tag increments the distance,
# so post-release versioning yields a real, monotonic version: X.Y at the tag,
# X.Y.postN N commits later. "no-local-version" keeps it PyPI-upload safe.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/rpi_hwid/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi_hwid"]

[tool.hatch.build.targets.wheel.force-include]
"src/rpi_hwid/py.typed" = "rpi_hwid/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=rpi_hwid --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100
extend-exclude = ["src/rpi_hwid/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "TC", "C4", "PIE", "RET", "N"]

[tool.ruff.lint.per-file-ignores]
# The two probe modules are single-file scripts that must run unchanged on a
# Pi's python3 3.5 (fed over ssh), so they keep %-formatting, no f-strings,
# no walrus, and their own small helpers; the modern-syntax rules do not apply.
"src/rpi_hwid/probe.py" = ["UP", "SIM", "RUF", "B", "C4", "PIE", "RET"]
"src/rpi_hwid/fpga.py" = ["UP", "SIM", "RUF", "B", "C4", "PIE", "RET"]
# The label generator is ported from a proven script and drawn in points and
# millimetres; its long argument lists read better unwrapped.
"src/rpi_hwid/labels.py" = ["RUF", "B", "SIM", "C4", "PIE", "RET", "UP031", "UP032"]

[tool.mypy]
packages = ["rpi_hwid"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "rpi_hwid._version"
ignore_errors = true

# The probe modules are annotation-free on purpose (python 3.5 on the target);
# the label generator drives reportlab, which ships no stubs. The CLI calls
# into them, so it may call untyped functions and return what they return.
[[tool.mypy.overrides]]
module = ["rpi_hwid.probe", "rpi_hwid.fpga", "rpi_hwid.labels"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "rpi_hwid.cli"
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["reportlab.*", "svglib.*", "segno.*", "PIL.*", "zxingcpp.*"]
ignore_missing_imports = true
